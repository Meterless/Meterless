<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Overview of eight published Meterless benchmark reports with one headline number each: Windows PC 108 of 108 catalog jobs; Mac M1 to M4 edition engine restarts 19 to 0; agent frameworks +4.29 on Haiku; 3D bench 246 of 246 valid GLBs; job modes 306 of 310 candidates scored; knowledge work 0 to 11 verified deliverables per run; Mac M5 24 of 24 winners correct; real nights 5,361 landed attempts.</title>
