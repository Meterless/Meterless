  <title>Bar chart: median seconds per job for twelve Nightshift catalog fleets on a Windows PC with an RTX 3090 against a 16 GB Mac M5. Where the Mac had to rotate models the PC was 4 to 115 times faster, for example ext-lite 3.3 s against 379 s. Where both ran fully resident the PC was up to 3 times faster.</title>
