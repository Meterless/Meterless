  <text x="319.0" y="455.0" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="600">−9.61</text>
  <text x="40.0" y="506.0" font-size="11" fill="#756D60" text-anchor="start">Interim: about 18 runs per arm, p-values not corrected. Both Meterless arms cost 66 to 68% more than the Haiku baseline. On Opus 5.5 no framework moved quality clearly.</text>
