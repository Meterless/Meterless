<svg viewBox="0 0 960 528" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Diverging bar chart: quality lift over a same-model baseline on Claude Haiku 4.5 for fifteen arms. Meterless context layer +4.29 and Meterless prompt cards +3.36 were the only arms to clear the pre-registered bar of +1.29 set by the minimal-prompt control. The irrelevant-context placebo scored -9.61.</title>
  <rect x="0.5" y="0.5" width="959" height="527" rx="16" fill="#FBF7F0" stroke="#E7DFD3"/>
  <text x="40.0" y="44.0" font-size="20" fill="#171310" text-anchor="start" font-weight="700">Two frameworks cleared the bar on Haiku 4.5. Both were Meterless.</text>
  <text x="40.0" y="66.0" font-size="12" fill="#756D60" text-anchor="start">Quality lift over the same-model baseline, task-balanced mean. 11 tasks, hidden graders. Interim, Oct 12, 2026: 675 of 774 runs graded.</text>
