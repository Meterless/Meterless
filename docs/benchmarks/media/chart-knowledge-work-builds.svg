<svg viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Column chart: verified business deliverables per Nightshift benchmark run by build. v1.2.3 on Sep 23: 0. v1.2.7 on Sep 26: 3. v1.2.9 on Sep 27: 4. v1.3.0 on Sep 28: 11.</title>
  <rect x="0.5" y="0.5" width="959" height="379" rx="16" fill="#FBF7F0" stroke="#E7DFD3"/>
  <text x="40.0" y="44.0" font-size="20" fill="#171310" text-anchor="start" font-weight="700">Same business briefs, four builds, six days: 0, then 3, then 4, then 11.</text>
  <text x="40.0" y="66.0" font-size="12" fill="#756D60" text-anchor="start">Verified business deliverables per benchmark run. Same machine and open models, graded against an answer key. Sep 23 to 28, 2026.</text>
