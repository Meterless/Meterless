<svg viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Bar chart: a dedicated judge lane against majority vote on a DGX Spark. Best partial answer found 11 of 11 with the judge lane against 1 of 10 by majority vote. Best-scoring candidate picked 22 of 26 against 16 of 27. An owner fleet with no judge lane scored 0 of 59 shortlisted candidates on build 1.3.2 and 17 of 20 on build 1.3.4.</title>
  <rect x="0.5" y="0.5" width="959" height="379" rx="16" fill="#FBF7F0" stroke="#E7DFD3"/>
  <text x="40.0" y="44.0" font-size="20" fill="#171310" text-anchor="start" font-weight="700">Who picks the winner decides what you wake up to.</text>
  <text x="40.0" y="66.0" font-size="12" fill="#756D60" text-anchor="start">A dedicated 30B judge lane against majority votes. Same fleet, same fixtures, counts are jobs. DGX Spark, builds 1.3.2 to 1.3.4, Oct 1 to 3, 2026.</text>
  <text x="40.0" y="106.0" font-size="12" fill="#171310" text-anchor="start" font-weight="600">Found the best partial answer when no candidate was fully right</text>
  <text x="188.0" y="129.0" font-size="11" fill="#756D60" text-anchor="end">Judge lane</text>
  <rect x="200" y="119" width="620" height="13" rx="3" fill="#E7DFD3"/>
  <rect x="200.0" y="119.0" width="620.0" height="13.0" rx="3" fill="#79a632"><animate attributeName="width" from="0" to="620.0" dur="0.9s" begin="0.00s" fill="freeze"/></rect>
  <text x="830.0" y="130.0" font-size="12" fill="#171310" text-anchor="start" font-weight="700">11/11</text>
  <text x="188.0" y="151.0" font-size="11" fill="#756D60" text-anchor="end">Majority vote</text>
  <rect x="200" y="141" width="620" height="13" rx="3" fill="#E7DFD3"/>
  <rect x="200.0" y="141.0" width="62.0" height="13.0" rx="3" fill="#C9BDA8"><animate attributeName="width" from="0" to="62.0" dur="0.9s" begin="0.10s" fill="freeze"/></rect>
  <text x="830.0" y="152.0" font-size="12" fill="#171310" text-anchor="start" font-weight="700">1/10</text>
  <text x="40.0" y="184.0" font-size="12" fill="#171310" text-anchor="start" font-weight="600">Picked the best-scoring candidate</text>
  <text x="188.0" y="207.0" font-size="11" fill="#756D60" text-anchor="end">Judge lane</text>
  <rect x="200" y="197" width="620" height="13" rx="3" fill="#E7DFD3"/>
  <rect x="200.0" y="197.0" width="524.6" height="13.0" rx="3" fill="#79a632"><animate attributeName="width" from="0" to="524.6" dur="0.9s" begin="0.20s" fill="freeze"/></rect>
  <text x="830.0" y="208.0" font-size="12" fill="#171310" text-anchor="start" font-weight="700">22/26</text>
  <text x="188.0" y="229.0" font-size="11" fill="#756D60" text-anchor="end">Majority vote</text>
  <rect x="200" y="219" width="620" height="13" rx="3" fill="#E7DFD3"/>
  <rect x="200.0" y="219.0" width="367.4" height="13.0" rx="3" fill="#C9BDA8"><animate attributeName="width" from="0" to="367.4" dur="0.9s" begin="0.30s" fill="freeze"/></rect>
  <text x="830.0" y="230.0" font-size="12" fill="#171310" text-anchor="start" font-weight="700">16/27</text>
  <text x="40.0" y="262.0" font-size="12" fill="#171310" text-anchor="start" font-weight="600">Owner fleet with no judge lane: shortlisted candidates scored</text>
  <text x="188.0" y="285.0" font-size="11" fill="#756D60" text-anchor="end">Build 1.3.2</text>
  <rect x="200" y="275" width="620" height="13" rx="3" fill="#E7DFD3"/>
  <text x="830.0" y="286.0" font-size="12" fill="#171310" text-anchor="start" font-weight="700">0/59</text>
  <text x="188.0" y="307.0" font-size="11" fill="#756D60" text-anchor="end">Build 1.3.4</text>
  <rect x="200" y="297" width="620" height="13" rx="3" fill="#E7DFD3"/>
  <rect x="200.0" y="297.0" width="527.0" height="13.0" rx="3" fill="#79a632"><animate attributeName="width" from="0" to="527.0" dur="0.9s" begin="0.50s" fill="freeze"/></rect>
  <text x="830.0" y="308.0" font-size="12" fill="#171310" text-anchor="start" font-weight="700">17/20</text>
  <text x="40.0" y="358.0" font-size="11" fill="#756D60" text-anchor="start">Bulk was the most dependable mode: 220 of 220 units correct. 12 of 12 generated apps passed “verified”, but only 6 of 12 worked.</text>
</svg>
