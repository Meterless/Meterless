<svg viewBox="0 0 960 416" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Paired bar chart for eight on-device models in the Nightshift M1 to M4 edition. Llama 3.2 3B scored best at 32 of 34 prompts at 27 tokens per second. Llama 3.2 1B was fastest at 90 tokens per second with 23 of 34.</title>
