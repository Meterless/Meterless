<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Line chart: distinct solution clusters found as attempts landed in four real Nightshift races, August 17 to September 5, 2026. Race A reached 37 clusters by attempt 264, Race B 33 by attempt 288, Race C 35 by attempt 299, and Race D 25 by attempt 253. Every race was still finding new clusters near attempt 250. A single prompt returns one answer.</title>
