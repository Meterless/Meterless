<svg viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Meterless timeline: the four engine specs shipped, then the free apps Gaia, Relay and Swarms, then the experiments Meterless City, Sitcomify and DataPlant, then Nightshift with a live free web edition, a Mac edition on preorder for Q4 2026 and a DGX edition on request. Next: the swarm-orchestration and runtime engine specs, then fulcrum.</title>

  <rect x="0.5" y="0.5" width="959" height="299" rx="16" fill="#FBF7F0" stroke="#E7DFD3"/>

  <text x="40" y="46" font-size="20" font-weight="700" fill="#171310">What has shipped, and what comes next</text>

  <line x1="60" y1="150" x2="900" y2="150" stroke="#D9CFC0" stroke-width="2"/>
  <path d="M893 144 L903 150 L893 156" fill="none" stroke="#D9CFC0" stroke-width="2"/>

  <rect x="72" y="92" width="578" height="20" rx="10" fill="#E6F6EC"/>
  <text x="361" y="106" font-size="10.5" font-weight="700" fill="#1E6B34" letter-spacing="1" text-anchor="middle">SHIPPED</text>
  <rect x="682" y="92" width="210" height="20" rx="10" fill="#EFEAFB"/>
  <text x="787" y="106" font-size="10.5" font-weight="700" fill="#6A3FC7" letter-spacing="1" text-anchor="middle">NEXT</text>

  <g font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="130" cy="150" r="8" fill="#2B8A3E"/>
    <text x="130" y="180" fill="#1E6B34">Engine specs</text>
    <text x="130" y="196" font-size="10" font-weight="400" fill="#756D60">H-MEM · World Model</text>
    <text x="130" y="210" font-size="10" font-weight="400" fill="#756D60">Markovian · Scout Intent</text>

    <circle cx="270" cy="150" r="8" fill="#7C4DE0"/>
    <text x="270" y="180" fill="#6A3FC7">Free apps</text>
    <text x="270" y="196" font-size="10" font-weight="400" fill="#756D60">Gaia · Relay · Swarms</text>
    <text x="270" y="210" font-size="10" font-weight="400" fill="#756D60">plus 5 browser utilities</text>

    <circle cx="410" cy="150" r="8" fill="#E8590C"/>
    <text x="410" y="180" fill="#C74E0B">Experiments</text>
    <text x="410" y="196" font-size="10" font-weight="400" fill="#756D60">Meterless City · Sitcomify</text>
    <text x="410" y="210" font-size="10" font-weight="400" fill="#756D60">DataPlant</text>

    <circle cx="570" cy="150" r="11" fill="#171310"/>
    <circle cx="570" cy="150" r="4" fill="#F2C14E"/>
    <text x="570" y="180" fill="#171310">Nightshift</text>
    <text x="570" y="196" font-size="10" font-weight="400" fill="#756D60">web edition live · Mac preorder,</text>
    <text x="570" y="210" font-size="10" font-weight="400" fill="#756D60">ships Q4 2026 · DGX on request</text>

    <circle cx="712" cy="150" r="7" fill="#FBF7F0" stroke="#7C4DE0" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="712" y="180" fill="#6A3FC7">swarm-orchestration</text>
    <text x="712" y="196" font-size="10" font-weight="400" fill="#9A9284">in the apps today</text>
    <text x="712" y="210" font-size="10" font-weight="400" fill="#9A9284">spec pending</text>

    <circle cx="826" cy="150" r="7" fill="#FBF7F0" stroke="#0FA97A" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="826" y="180" fill="#0B8560">runtime</text>
    <text x="826" y="196" font-size="10" font-weight="400" fill="#9A9284">inside Nightshift</text>
    <text x="826" y="210" font-size="10" font-weight="400" fill="#9A9284">contract public</text>

    <circle cx="884" cy="150" r="6" fill="#FBF7F0" stroke="#9A9284" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="884" y="232" font-size="11" fill="#756D60">fulcrum</text>
    <text x="884" y="246" font-size="10" font-weight="400" fill="#9A9284">planned</text>
  </g>

  <g fill="none" stroke-width="2">
    <circle cx="130" cy="150" r="8" stroke="#2B8A3E" opacity="0">
      <animate attributeName="r" values="8;18" dur="8s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0" keyTimes="0;0.12;1" dur="8s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="270" cy="150" r="8" stroke="#7C4DE0" opacity="0">
      <animate attributeName="r" values="8;18" dur="8s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0" keyTimes="0;0.12;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="410" cy="150" r="8" stroke="#E8590C" opacity="0">
      <animate attributeName="r" values="8;18" dur="8s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0" keyTimes="0;0.12;1" dur="8s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="570" cy="150" r="11" stroke="#F2C14E" opacity="0">
      <animate attributeName="r" values="11;24" dur="8s" begin="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.14;1" dur="8s" begin="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle r="4" fill="#171310" opacity="0">
    <set attributeName="opacity" to="0.8" begin="0s"/>
    <animateMotion dur="8s" repeatCount="indefinite" path="M60 150 L900 150"/>
  </circle>

  <text x="40" y="278" font-size="11" fill="#9A9284">Dates are targets and can move. A folder appears under engines/ on drop day with the full spec, examples and a conformance suite.</text>
</svg>
