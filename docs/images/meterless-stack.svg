<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The Meterless stack: your apps call one OpenAI-compatible Meterless provider. The Meterless Runtime and Nightshift serve those apps by day and race queued jobs by night, on the open engines (Scout Intent, H-MEM, World Model, Markovian, Swarm), on hardware you own. Kept work and signed receipts land on your disk.</title>

  <rect x="0.5" y="0.5" width="959" height="559" rx="16" fill="#FBF7F0" stroke="#E7DFD3"/>

  <text x="40" y="44" font-size="20" font-weight="700" fill="#171310">One runtime: your apps by day, your queued jobs at night</text>
  <text x="40" y="66" font-size="12" fill="#756D60">Nightshift and the Meterless Runtime sit in the middle. Apps call in from above. The open engines run inside.</text>

  <!-- spine -->
  <g stroke="#D9CFC0" stroke-width="1.5">
    <line x1="480" y1="132" x2="480" y2="150"/>
    <line x1="480" y1="196" x2="480" y2="214"/>
    <line x1="480" y1="354" x2="480" y2="372"/>
    <line x1="480" y1="430" x2="480" y2="448"/>
  </g>

  <!-- 1 apps -->
  <text x="40" y="96" font-size="10.5" font-weight="700" fill="#9A9284" letter-spacing="1">YOUR APPS</text>
  <g font-size="11.5" font-weight="600" text-anchor="middle">
    <rect x="130" y="82" width="86" height="28" rx="14" fill="#FFFFFF" stroke="#D9CFC0"/><text x="173" y="100" fill="#3B342C">Cursor</text>
    <rect x="224" y="82" width="104" height="28" rx="14" fill="#FFFFFF" stroke="#D9CFC0"/><text x="276" y="100" fill="#3B342C">Claude Code</text>
    <rect x="336" y="82" width="64" height="28" rx="14" fill="#FFFFFF" stroke="#7C4DE0"/><text x="368" y="100" fill="#6A3FC7">Gaia</text>
    <rect x="408" y="82" width="68" height="28" rx="14" fill="#FFFFFF" stroke="#7C4DE0"/><text x="442" y="100" fill="#6A3FC7">Relay</text>
    <rect x="484" y="82" width="78" height="28" rx="14" fill="#FFFFFF" stroke="#7C4DE0"/><text x="523" y="100" fill="#6A3FC7">Swarms</text>
    <rect x="570" y="82" width="114" height="28" rx="14" fill="#FFFFFF" stroke="#E8590C"/><text x="627" y="100" fill="#C74E0B">Meterless City</text>
    <rect x="692" y="82" width="86" height="28" rx="14" fill="#FFFFFF" stroke="#E8590C"/><text x="735" y="100" fill="#C74E0B">Sitcomify</text>
    <rect x="786" y="82" width="90" height="28" rx="14" fill="#FFFFFF" stroke="#E8590C"/><text x="831" y="100" fill="#C74E0B">DataPlant</text>
  </g>
  <text x="480" y="126" font-size="10.5" fill="#9A9284" text-anchor="middle">coding agents · free Meterless apps · experiments · anything that speaks the OpenAI API</text>

  <!-- 2 provider -->
  <rect x="250" y="150" width="460" height="46" rx="10" fill="#FFFFFF" stroke="#171310" stroke-width="1.4"/>
  <text x="480" y="170" font-size="13.5" font-weight="700" fill="#171310" text-anchor="middle">Meterless provider · OpenAI-compatible</text>
  <text x="480" y="187" font-size="10.5" fill="#756D60" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">127.0.0.1:8088/v1 · meterless/auto · fast · deep · cheap · local · fusion</text>

  <!-- 3 runtime + nightshift -->
  <rect x="120" y="214" width="720" height="140" rx="14" fill="#171310"/>
  <text x="480" y="240" font-size="15" font-weight="700" fill="#FBF7F0" text-anchor="middle">Meterless Runtime + Nightshift</text>
  <text x="480" y="257" font-size="10.5" fill="#B9AE9C" text-anchor="middle">a local AI production control plane above llama.cpp, whisper, stable-diffusion.cpp, ACE-Step and TTS engines</text>

  <rect x="140" y="270" width="330" height="70" rx="10" fill="#26201A" stroke="#F2C14E" stroke-width="1.2"/>
  <text x="160" y="292" font-size="12.5" font-weight="700" fill="#F2C14E">&#9728; While you use it · Depth posture</text>
  <text x="160" y="310" font-size="10.8" fill="#E7DFD3">Serves text, image, video and speech to</text>
  <text x="160" y="325" font-size="10.8" fill="#E7DFD3">every connected app. One lane per request.</text>

  <rect x="490" y="270" width="330" height="70" rx="10" fill="#26201A" stroke="#9B8CFF" stroke-width="1.2"/>
  <text x="510" y="292" font-size="12.5" font-weight="700" fill="#B7ABFF">&#9790; When you step away · Swarm posture</text>
  <text x="510" y="310" font-size="10.8" fill="#E7DFD3">Lanes race queued jobs, scribes read every</text>
  <text x="510" y="325" font-size="10.8" fill="#E7DFD3">attempt, judges and checks settle the outcome.</text>

  <!-- posture switch shimmer -->
  <rect x="140" y="270" width="330" height="70" rx="10" fill="#F2C14E" opacity="0">
    <animate attributeName="opacity" values="0;0.16;0;0;0" keyTimes="0;0.2;0.4;0.9;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <rect x="490" y="270" width="330" height="70" rx="10" fill="#9B8CFF" opacity="0">
    <animate attributeName="opacity" values="0;0;0.2;0;0" keyTimes="0;0.45;0.62;0.82;1" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- 4 engines -->
  <text x="40" y="392" font-size="10.5" font-weight="700" fill="#9A9284" letter-spacing="1">OPEN ENGINES</text>
  <g font-size="12.5" font-weight="700" text-anchor="middle">
    <rect x="130" y="372" width="134" height="58" rx="10" fill="#FFFFFF" stroke="#2B8A3E" stroke-width="1.6"/>
    <text x="197" y="396" fill="#1E6B34">Scout Intent</text>
    <text x="197" y="413" font-size="10" font-weight="400" fill="#756D60">intent · guard · route</text>

    <rect x="274" y="372" width="134" height="58" rx="10" fill="#FFFFFF" stroke="#E8590C" stroke-width="1.6"/>
    <text x="341" y="396" fill="#C74E0B">H-MEM</text>
    <text x="341" y="413" font-size="10" font-weight="400" fill="#756D60">memory that lasts</text>

    <rect x="418" y="372" width="134" height="58" rx="10" fill="#FFFFFF" stroke="#3B5BDB" stroke-width="1.6"/>
    <text x="485" y="396" fill="#3049B5">World Model</text>
    <text x="485" y="413" font-size="10" font-weight="400" fill="#756D60">shared state, sourced</text>

    <rect x="562" y="372" width="134" height="58" rx="10" fill="#FFFFFF" stroke="#E03131" stroke-width="1.6"/>
    <text x="629" y="396" fill="#C22525">Markovian</text>
    <text x="629" y="413" font-size="10" font-weight="400" fill="#756D60">bounded long runs</text>

    <rect x="706" y="372" width="134" height="58" rx="10" fill="#FFFFFF" stroke="#7C4DE0" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="773" y="396" fill="#6A3FC7">Swarm</text>
    <text x="773" y="413" font-size="10" font-weight="400" fill="#9A8BC4">in the apps · spec next</text>
  </g>

  <!-- 5 hardware -->
  <rect x="120" y="448" width="720" height="46" rx="10" fill="#FFFFFF" stroke="#0FA97A" stroke-width="1.6"/>
  <text x="480" y="468" font-size="13.5" font-weight="700" fill="#0B8560" text-anchor="middle">Hardware you own</text>
  <text x="480" y="485" font-size="10.8" fill="#756D60" text-anchor="middle">Apple Silicon Mac · NVIDIA DGX Spark · Windows PC · local models first, cloud only if you add a key</text>

  <!-- request pulse: apps to runtime -->
  <circle r="4.5" fill="#F2C14E" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.3;0.32;1" dur="9s" repeatCount="indefinite"/>
    <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.3;1" path="M368 110 C368 140 470 140 470 214 L300 270"/>
  </circle>
  <circle r="4.5" fill="#F2C14E" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.1;0.36;0.38;1" dur="9s" repeatCount="indefinite"/>
    <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.08;0.36;1" path="M276 110 C276 140 480 140 480 214 L320 286"/>
  </circle>
  <!-- night pulses: attempts racing -->
  <g fill="#B7ABFF">
    <circle r="3" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.5;0.56;0.8;1" dur="9s" repeatCount="indefinite"/>
      <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5;0.8;1" path="M520 336 L800 296"/>
    </circle>
    <circle r="3" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.54;0.6;0.84;1" dur="9s" repeatCount="indefinite"/>
      <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.54;0.84;1" path="M520 300 L800 330"/>
    </circle>
    <circle r="3" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.58;0.64;0.88;1" dur="9s" repeatCount="indefinite"/>
      <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.58;0.88;1" path="M520 318 L800 312"/>
    </circle>
  </g>
  <!-- kept work drops to disk -->
  <circle r="4.5" fill="#0FA97A" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.86;0.88;0.98;1" dur="9s" repeatCount="indefinite"/>
    <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.86;0.98;1" path="M480 354 L480 471"/>
  </circle>

  <text x="40" y="530" font-size="11" fill="#9A9284">Every routed answer carries a signed receipt. Kept work, methods and skills stay on your disk in formats you can read.</text>
</svg>
